# Render Blueprint — API + Postgres + Redis.
# Frontends: deploy as Vercel projects (see DEPLOY-CLOUD.md) or Render Static Sites.
databases:
  - name: chote-bade-db
    plan: free
    postgresMajorVersion: '16'

services:
  - type: keyvalue
    name: chote-bade-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: chote-bade-api
    runtime: node
    plan: starter
    healthCheckPath: /health
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cafe/shared-types build && pnpm exec prisma generate --schema=prisma/schema.prisma && pnpm --filter @cafe/backend build
    startCommand: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma && node apps/backend/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chote-bade-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chote-bade-redis
          type: keyvalue
          property: connectionString
      - key: STAFF_SESSION_SECRET
        generateValue: true
      - key: ALLOW_FAKE_PAYMENTS
        value: '0'
      - key: SEED_ON_BOOT
        value: '1'
      - key: PETPOOJA_ADAPTER
        value: fake
      - key: PAYMENT_ADAPTER
        value: fake
      - key: NOTIFICATION_ADAPTER
        value: fake
      - key: CORS_ORIGINS
        sync: false
      - key: PETPOOJA_WEBHOOK_SECRET
        generateValue: true
