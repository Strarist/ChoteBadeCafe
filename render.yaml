# Optional IaC — do NOT apply this as a Blueprint if you want $0.
# Blueprints / Starter plans ask for a card.
# Follow DEPLOY-CLOUD.md and create each Free service by hand instead.
#
# If you later add billing, you can switch plans here and apply a Blueprint.
databases:
  - name: chote-bade-db
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: chote-bade-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @cafe/shared-types build && pnpm exec prisma generate --schema=prisma/schema.prisma && pnpm --filter @cafe/backend build
    startCommand: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma && pnpm db:seed && node apps/backend/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chote-bade-db
          property: connectionString
      - key: STAFF_SESSION_SECRET
        generateValue: true
      - key: ALLOW_FAKE_PAYMENTS
        value: '0'
      - key: PETPOOJA_ADAPTER
        value: fake
      - key: PAYMENT_ADAPTER
        value: fake
      - key: NOTIFICATION_ADAPTER
        value: fake
      - key: CORS_ORIGINS
        sync: false
      - key: PETPOOJA_WEBHOOK_SECRET
        generateValue: true
