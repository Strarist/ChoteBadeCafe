name: Secret scan

on:
  push:
  pull_request:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan for env files and credential patterns
        run: node scripts/check-secrets.js
