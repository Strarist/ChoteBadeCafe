<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="940" height="260" fill="none">
  <defs>
    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB8"/>
      <stop offset="50%" stop-color="#FBD988"/>
      <stop offset="100%" stop-color="#D8A344"/>
    </linearGradient>
    <linearGradient id="hBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E56070"/>
      <stop offset="100%" stop-color="#C7384A"/>
    </linearGradient>
    <radialGradient id="hBadgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#2D1F1D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1C1210" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-opacity="0.35" flood-color="#000"/>
    </filter>
  </defs>
  

  <!-- Left Medallion Badge (Scale 0.4, 240x240) -->
  <g transform="translate(10, 10) scale(0.4)" filter="url(#hShadow)">
    <!-- Outer Double Border -->
    <circle cx="300" cy="300" r="286" stroke="#C88E38" stroke-width="11" fill="url(#hBadgeGlow)"/>
    <circle cx="300" cy="300" r="271" stroke="#FBD988" stroke-width="3" stroke-dasharray="10 5" opacity="0.9"/>
    <circle cx="300" cy="300" r="262" stroke="#C88E38" stroke-width="1.8" opacity="0.5"/>

    <!-- Mascots -->
    <g id="h-mascots">
      <!-- Left Mascot (Chote) -->
      <g id="h-chote">
        <!-- Neck -->
        <path d="M 224 168 L 256 168 L 252 180 L 228 180 Z" fill="#8B1E2D"/>
        <!-- Ears -->
        <circle cx="204" cy="144" r="9" fill="#FEE8DC" stroke="#2C1916" stroke-width="3"/>
        <circle cx="276" cy="144" r="9" fill="#FEE8DC" stroke="#2C1916" stroke-width="3"/>
        <!-- Face -->
        <ellipse cx="240" cy="144" rx="38" ry="36" fill="#FEE8DC" stroke="#2C1916" stroke-width="3.5"/>
        <!-- Hair Base -->
        <path d="M 202 140 C 200 96, 222 84, 240 84 C 260 84, 278 96, 278 140 C 272 120, 264 110, 252 116 C 242 108, 228 112, 222 122 C 215 116, 206 124, 202 140 Z" fill="#2C1916"/>
        <!-- Hair strands -->
        <path d="M 214 114 Q 224 126 236 118 Q 248 128 260 114 Q 268 126 274 136" stroke="#2C1916" stroke-width="3.6" fill="none" stroke-linecap="round"/>
        <path d="M 204 124 C 208 116, 216 112, 222 118" stroke="#2C1916" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- Eyebrows -->
        <path d="M 220 134 Q 227 129 234 134" stroke="#2C1916" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M 246 134 Q 253 129 260 134" stroke="#2C1916" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <!-- Eyes -->
        <path d="M 220 142 C 224 134, 234 134, 238 142" stroke="#2C1916" stroke-width="3.8" stroke-linecap="round" fill="none"/>
        <path d="M 244 142 C 248 134, 258 134, 262 142" stroke="#2C1916" stroke-width="3.8" stroke-linecap="round" fill="none"/>
        <!-- Blush -->
        <ellipse cx="218" cy="151" rx="7.5" ry="5" fill="#FF7582" opacity="0.75"/>
        <ellipse cx="262" cy="151" rx="7.5" ry="5" fill="#FF7582" opacity="0.75"/>
        <!-- Smile -->
        <path d="M 234 152 Q 241 163 248 152 Z" fill="#9E2A38" stroke="#2C1916" stroke-width="2.4" stroke-linejoin="round"/>
      </g>

      <!-- Right Mascot (Bade) -->
      <g id="h-bade">
        <!-- Neck -->
        <path d="M 354 168 L 386 168 L 382 180 L 358 180 Z" fill="#FFFFFF" stroke="#2C1916" stroke-width="2.2"/>
        <!-- Chef Hat (Toque) -->
        <g id="h-toque">
          <path d="M 334 94 C 318 82, 316 54, 336 42 C 346 32, 364 30, 372 40 C 380 28, 404 30, 412 46 C 428 54, 428 80, 412 94 Z" fill="#FFFFFF" stroke="#2C1916" stroke-width="3.6" stroke-linejoin="round"/>
          <path d="M 352 86 C 348 64, 356 50, 366 44" stroke="#2C1916" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <path d="M 378 86 C 382 62, 390 50, 396 46" stroke="#2C1916" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <path d="M 336 76 C 340 64, 344 58, 348 54" stroke="#2C1916" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <rect x="330" y="90" width="80" height="18" rx="4" fill="#FFFFFF" stroke="#2C1916" stroke-width="3.4"/>
          <line x1="344" y1="90" x2="344" y2="108" stroke="#2C1916" stroke-width="1.8"/>
          <line x1="396" y1="90" x2="396" y2="108" stroke="#2C1916" stroke-width="1.8"/>
        </g>
        <!-- Ears -->
        <circle cx="330" cy="144" r="9" fill="#FEE8DC" stroke="#2C1916" stroke-width="3"/>
        <circle cx="410" cy="144" r="9" fill="#FEE8DC" stroke="#2C1916" stroke-width="3"/>
        <!-- Face -->
        <ellipse cx="370" cy="144" rx="40" ry="37" fill="#FEE8DC" stroke="#2C1916" stroke-width="3.5"/>
        <!-- Hair on sides -->
        <path d="M 333 128 C 333 110, 340 104, 346 106 C 340 118, 340 128, 335 138 Z" fill="#2C1916"/>
        <path d="M 407 128 C 407 110, 400 104, 394 106 C 400 118, 400 128, 405 138 Z" fill="#2C1916"/>
        <!-- Eyebrows -->
        <path d="M 348 134 Q 356 129 364 134" stroke="#2C1916" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M 376 134 Q 384 129 392 134" stroke="#2C1916" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <!-- Eyes -->
        <path d="M 350 142 C 354 134, 364 134, 368 142" stroke="#2C1916" stroke-width="3.8" stroke-linecap="round" fill="none"/>
        <path d="M 374 142 C 378 134, 388 134, 392 142" stroke="#2C1916" stroke-width="3.8" stroke-linecap="round" fill="none"/>
        <!-- Blush -->
        <ellipse cx="348" cy="151" rx="7.5" ry="5" fill="#FF7582" opacity="0.75"/>
        <ellipse cx="392" cy="151" rx="7.5" ry="5" fill="#FF7582" opacity="0.75"/>
        <!-- Mustache -->
        <path d="M 353 151 Q 371 145 389 151 Q 380 160 371 154 Q 362 160 353 151 Z" fill="#2C1916"/>
        <!-- Beard along jaw -->
        <path d="M 338 146 C 340 168, 353 180, 371 180 C 389 180, 402 168, 404 146 C 398 171, 384 175, 371 175 C 358 175, 344 171, 338 146 Z" fill="#2C1916"/>
        <!-- Smile -->
        <path d="M 364 156 Q 371 164 378 156" stroke="#2C1916" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Floating Heart -->
      <path d="M 305 138 C 305 138, 288 122, 288 111 C 288 101, 296 96, 305 103 C 314 96, 322 101, 322 111 C 322 122, 305 138, 305 138 Z" fill="#E53935"/>
      <circle cx="295" cy="107" r="2.4" fill="#FFA4A4" opacity="0.85"/>
    </g>

    <!-- Monogram CB -->
    <g id="h-cb">
      <!-- Letter C (Burgundy) -->
      <path d="M 276 215 C 265 196, 242 188, 218 188 C 166 188, 126 228, 126 280 C 126 332, 166 372, 220 372 C 248 372, 270 358, 282 340 C 285 335, 279 330, 274 333 C 260 346, 243 352, 222 352 C 178 352, 146 320, 146 280 C 146 240, 178 208, 220 208 C 242 208, 258 216, 270 228 C 274 232, 279 227, 276 215 Z" fill="url(#hBurgundy)"/>
      <circle cx="273" cy="216" r="10.5" fill="url(#hBurgundy)"/>
      <circle cx="280" cy="338" r="9" fill="url(#hBurgundy)"/>

      <!-- Letter B (Gold) -->
      <path d="M 292 192 L 372 192 C 404 192, 428 206, 428 236 C 428 256, 412 270, 392 276 C 418 282, 438 300, 438 328 C 438 360, 408 372, 372 372 L 292 372 L 292 192 Z M 328 212 L 328 268 L 368 268 C 388 268, 400 258, 400 240 C 400 222, 388 212, 368 212 L 328 212 Z M 328 286 L 328 352 L 372 352 C 394 352, 408 340, 408 318 C 408 296, 394 286, 372 286 L 328 286 Z" fill="url(#hGold)"/>
      <path d="M 280 192 L 314 192 L 314 200 L 280 200 Z M 280 364 L 314 364 L 314 372 L 280 372 Z" fill="url(#hGold)"/>
    </g>

    <!-- Cutlery & Steaming Cup -->
    <g id="h-cutlery" fill="#EDE6DA">
      <!-- Spoon (Left) -->
      <circle cx="114" cy="404" r="6.5"/>
      <path d="M 114 402 L 192 402 Q 196 404 192 406 L 114 406 Z"/>
      <ellipse cx="214" cy="404" rx="22" ry="11"/>

      <!-- Steaming Cup (Center) -->
      <path d="M 288 387 C 285 379, 292 374, 289 365" stroke="#FBD988" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 300 384 C 297 374, 304 368, 301 359" stroke="#FBD988" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M 312 387 C 309 379, 316 374, 313 365" stroke="#FBD988" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 276 395 C 276 416, 285 421, 300 421 C 315 421, 324 416, 324 395 Z"/>
      <path d="M 264 422 C 276 428, 324 428, 336 422 C 326 425, 274 425, 264 422 Z"/>
      <line x1="266" y1="423" x2="334" y2="423" stroke="#EDE6DA" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 322 398 C 334 398, 336 410, 323 412" stroke="#EDE6DA" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- Fork (Right) -->
      <path d="M 386 395 L 364 395 Q 360 404 364 413 L 386 413 L 386 410 L 368 410 Q 366 404 368 398 L 386 398 Z"/>
      <line x1="364" y1="401" x2="380" y2="401" stroke="#EDE6DA" stroke-width="2"/>
      <line x1="364" y1="407" x2="380" y2="407" stroke="#EDE6DA" stroke-width="2"/>
      <path d="M 386 402 L 480 402 Q 484 404 480 406 L 386 406 Z"/>
      <circle cx="486" cy="404" r="6.5"/>
    </g>

    <!-- Badge Typography -->
    <text x="300" y="470" text-anchor="middle" font-family="'Fraunces', 'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="800" letter-spacing="4" fill="#EDE6DA">CHOTE BADE</text>
    
    <g transform="translate(0, 10)">
      <line x1="182" y1="506" x2="236" y2="506" stroke="#FBD988" stroke-width="2.8" stroke-linecap="round"/>
      <text x="300" y="513" text-anchor="middle" font-family="'Fraunces', 'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="24" font-weight="700" letter-spacing="6" fill="#EDE6DA">CAFÉ</text>
      <line x1="364" y1="506" x2="418" y2="506" stroke="#FBD988" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- Flourish -->
    <path d="M 300 544 C 298 535, 290 531, 286 535 C 282 539, 288 548, 300 556 C 312 548, 318 539, 314 535 C 310 531, 302 535, 300 544 Z M 300 544 C 300 533, 295 524, 300 518 C 305 524, 300 533, 300 544 Z" fill="#FBD988"/>
  </g>

  <!-- Right Typography Wordmark -->
  <g transform="translate(265, 42)">
    <!-- Main Display: CHOTE BADE -->
    <text x="0" y="80" font-family="'Fraunces', 'Playfair Display', 'Georgia', serif" font-size="70" font-weight="800" letter-spacing="3" fill="#F5EFE6" filter="url(#hShadow)">CHOTE BADE</text>
    
    <!-- Sub-display: — CAFÉ — -->
    <g transform="translate(0, 128)">
      <line x1="0" y1="-9" x2="155" y2="-9" stroke="#FBD988" stroke-width="3.5" stroke-linecap="round"/>
      <text x="235" y="2" text-anchor="middle" font-family="'Fraunces', 'Cinzel', 'Georgia', serif" font-size="40" font-weight="700" letter-spacing="12" fill="#FBD988">CAFÉ</text>
      <line x1="315" y1="-9" x2="470" y2="-9" stroke="#FBD988" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Brand Tagline -->
    <g transform="translate(2, 168)">
      <text x="0" y="0" font-family="'Fraunces', 'Manrope', serif" font-size="17" font-weight="500" font-style="italic" letter-spacing="1.5" fill="rgba(237,230,218,0.7)">Chote moments, Bade memories</text>
      <circle cx="282" cy="-5" r="2.5" fill="#FBD988"/>
      <text x="296" y="0" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="rgba(237,230,218,0.55)">EST. 2025</text>
    </g>
  </g>
</svg>